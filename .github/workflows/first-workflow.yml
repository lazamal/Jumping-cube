name:  First workflow

on:
    push

jobs:
    smoke-test:
        runs-on: ubuntu-latest
        steps: 
            - uses: actions/checkout@v7
            - uses: actions/setup-python@v6
              with:
                python-version: "3.13"
            - run: pip install poetry
            - run: poetry install --no-root
            - run: poetry run pytest
