name:  First workflow

on:
    push

jobs:
    test-code:
        runs-on: ubuntu-latest
        steps: 
            - uses: actions/checkout@v7
            - uses: actions/setup-python@v6
              with:
                python-version: "3.13"
            - run: ls
            - run: pip install poetry
            - run: poetry install --no-root
            - run: poetry run pytest
    deploy-to-prod-mock:
        needs: test-code
        runs-on: ubuntu-latest
        steps:
            - run: echo "Deployed to prod practice"